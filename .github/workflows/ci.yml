name: CI

on:
  push:
    branches:
      - main
      - feature/**
      - fix/**
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build API
    if: >-
      (github.event_name == 'push' &&
      (startsWith(github.ref_name, 'feature/') || startsWith(github.ref_name, 'fix/') || github.ref_name == 'main')) ||
      (github.event_name == 'pull_request' &&
      (startsWith(github.head_ref, 'feature/') || startsWith(github.head_ref, 'fix/')))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Lab7.sln

      - name: Build
        run: dotnet build Lab7.sln --configuration Release --no-restore

  api-tests:
    name: API Tests (k6)
    if: >-
      (github.event_name == 'push' &&
      (startsWith(github.ref_name, 'feature/') || startsWith(github.ref_name, 'fix/') || github.ref_name == 'main')) ||
      (github.event_name == 'pull_request' &&
      (startsWith(github.head_ref, 'feature/') || startsWith(github.head_ref, 'fix/')))
    runs-on: ubuntu-latest
    needs: build

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: Lab7
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Start API
        env:
          ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=Lab7;Username=postgres;Password=postgres
          Seed__Count: 100
        run: |
          dotnet run --project Lab7.Api/Lab7.Api.csproj --configuration Release --urls http://localhost:5000 > api.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://localhost:5000/api/students > /dev/null; then
              break
            fi
            sleep 2
          done

      - name: Run k6 smoke test
        run: k6 run tests/smoke_test.js

      - name: Print API logs on failure
        if: failure()
        run: cat api.log

  container-db-tests:
    name: Container / DB Tests (Testcontainers)
    if: >-
      (github.event_name == 'push' &&
      (startsWith(github.ref_name, 'feature/') || startsWith(github.ref_name, 'fix/') || github.ref_name == 'main')) ||
      (github.event_name == 'pull_request' &&
      (startsWith(github.head_ref, 'feature/') || startsWith(github.head_ref, 'fix/')))
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Lab7.sln

      - name: Run container DB tests
        run: dotnet test Lab7.Api.Tests/Lab7.Api.Tests.csproj --configuration Release --no-restore --filter "Category=ContainerDb"

  migrations:
    name: Migrations
    if: >-
      (github.event_name == 'push' &&
      (startsWith(github.ref_name, 'feature/') || startsWith(github.ref_name, 'fix/') || github.ref_name == 'main')) ||
      (github.event_name == 'pull_request' &&
      (startsWith(github.head_ref, 'feature/') || startsWith(github.head_ref, 'fix/')))
    runs-on: ubuntu-latest
    needs: build

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: Lab7
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Lab7.sln

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 10.*

      - name: Add .NET tools to PATH
        run: echo "$HOME/.dotnet/tools" >> $GITHUB_PATH

      - name: Apply migrations
        env:
          ConnectionStrings__DefaultConnection: Host=localhost;Port=5432;Database=Lab7;Username=postgres;Password=postgres
        run: dotnet ef database update --project Lab7.Api/Lab7.Api.csproj --startup-project Lab7.Api/Lab7.Api.csproj

  integration-api-tests:
    name: Integration API Tests (.NET)
    if: >-
      (github.event_name == 'push' &&
      (startsWith(github.ref_name, 'feature/') || startsWith(github.ref_name, 'fix/') || github.ref_name == 'main')) ||
      (github.event_name == 'pull_request' &&
      (startsWith(github.head_ref, 'feature/') || startsWith(github.head_ref, 'fix/')))
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Lab7.sln

      - name: Run integration API tests
        run: dotnet test Lab7.Api.Tests/Lab7.Api.Tests.csproj --configuration Release --no-restore --filter "Category=Api"
